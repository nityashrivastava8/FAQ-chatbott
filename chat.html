<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store help</title>
<style>
  :root {
    --sage: #e6ede9;
    --paper: #fbfcfb;
    --ink: #16312c;
    --muted: #5d716b;
    --green: #0f4c45;
    --green-soft: #d5e5df;
    --marigold: #f0b429;
    --line: #d3ddd8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: var(--ink);
    background: var(--sage);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .desk {
    width: 100%;
    max-width: 540px;
    height: min(720px, 100%);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 18px 40px -22px rgba(15, 76, 69, 0.45);
  }

  /* Header */
  .top {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    background: var(--green);
    color: #fff;
  }
  .badge {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: var(--marigold);
    color: var(--green);
    display: grid; place-items: center;
    flex: none;
  }
  .top h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .top p {
    margin: 2px 0 0;
    font-size: 13px;
    color: #bfd8d1;
    display: flex; align-items: center; gap: 6px;
  }
  .top p::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: #6fe3a5;
  }

  /* Messages */
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 22px 22px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .msg { max-width: 82%; display: flex; flex-direction: column; gap: 4px; }
  .msg.bot { align-self: flex-start; }
  .msg.me  { align-self: flex-end; align-items: flex-end; }
  .bubble {
    padding: 11px 15px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .bot .bubble {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px 18px 18px 18px;
  }
  .me .bubble {
    background: var(--green);
    color: #fff;
    border-radius: 18px 18px 4px 18px;
  }
  .time { font-size: 11.5px; color: var(--muted); padding: 0 4px; }

  /* Typing indicator */
  .typing .bubble { display: flex; gap: 5px; padding: 15px 16px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.1s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* Quick questions */
  .quick {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 4px 22px 14px;
  }
  .quick button {
    font: inherit; font-size: 14px;
    color: var(--green);
    background: var(--green-soft);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .quick button:hover { background: #c4dcd3; border-color: var(--green); }

  /* Composer */
  .compose {
    display: flex; gap: 10px;
    padding: 14px 18px 18px;
    border-top: 1px solid var(--line);
    background: #fff;
  }
  .compose input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--sage);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 13px 16px;
  }
  .compose input::placeholder { color: var(--muted); }
  .compose input:focus { outline: none; border-color: var(--green); background: #fff; }
  .compose button {
    width: 50px; flex: none;
    border: 0; border-radius: 14px;
    background: var(--marigold); color: var(--green);
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.15s;
  }
  .compose button:hover { transform: translateY(-1px); }
  .compose button:disabled { opacity: 0.5; cursor: default; transform: none; }
  button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

  @media (max-width: 520px) {
    body { padding: 0; }
    .desk { height: 100%; max-width: none; border-radius: 0; border: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .typing i { animation: none; opacity: 0.6; }
    .log { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <main class="desk">
    <header class="top">
      <div class="badge" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>
      </div>
      <div>
        <h1>Store help</h1>
        <p>Answers right away</p>
      </div>
    </header>

    <section class="log" id="log" aria-live="polite"></section>

    <div class="quick" id="quick">
      <button type="button">Return policy</button>
      <button type="button">Track my order</button>
      <button type="button">How long is shipping</button>
      <button type="button">Payment methods</button>
    </div>

    <form class="compose" id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Type your question" aria-label="Your question">
      <button id="send" type="submit" aria-label="Send question">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </form>
  </main>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const quick = document.getElementById("quick");

  function stamp() {
    return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function addMessage(text, who) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + who;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    const time = document.createElement("span");
    time.className = "time";
    time.textContent = stamp();
    wrap.append(bubble, time);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  function showTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot typing";
    wrap.innerHTML = '<div class="bubble"><i></i><i></i><i></i></div>';
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  async function ask(text) {
    text = text.trim();
    if (!text) return;
    quick.style.display = "none";
    addMessage(text, "me");
    input.value = "";
    send.disabled = true;
    const typing = showTyping();
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typing.remove();
      addMessage(data.answer, "bot");
    } catch (err) {
      typing.remove();
      addMessage("Can't reach the chatbot. Check that app.py is still running, then try again.", "bot");
    }
    send.disabled = false;
    input.focus();
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
  quick.querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => ask(b.textContent))
  );

  addMessage("Hi! Ask me about orders, shipping, returns, payments or your account.", "bot");
  input.focus();
</script>
</body>
</html>
